<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Emotion Detection</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <script src="{{ url_for('static', filename='mywebscript.js') }}"></script>
</head>
<body>
    <div class="container mt-5">
        <div class="card">
            <div class="card-body">
                <h1 class="text-center">NLP - Emotion Detection</h1>

                <label for="textToAnalyze">
                    Please enter the text to be analyzed
                </label>

                <textarea class="form-control" id="textToAnalyze" rows="4"></textarea>

                <button onclick="RunSentimentAnalysis()" class="btn btn-primary mt-3">
                    Run Sentiment Analysis
                </button>

                <h2 class="mt-4">Result of Emotion Detection</h2>
                <div id="system_response" class="mt-3"></div>
            </div>
        </div>
    </div>
</body>
</html>
